name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# ✅ THIS IS THE ONLY REQUIRED FIX
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: goel-aadhaar
          outputs: |
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
